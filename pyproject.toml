[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allegro-deals"
version = "0.1.0"
description = "Find mispriced offers on allegro.cz (e.g. PLN prices displayed as CZK)"
requires-python = ">=3.10"
dependencies = [
    "patchright>=1.61.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

# uv includes the "dev" dependency group by default, so `uv run pytest`
# works out of the box.
[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
allegro-deals = "allegro_deals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
